# Render Blueprint: real API (emails the sign-in code) + static web.
# Fill the sync:false values in the Render dashboard. Do NOT set VITE_DEMO or DEV_SHOW_OTP.
databases:
  - name: vo-db
    plan: free
services:
  - type: web
    name: vo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerTarget: api
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: AUTH_MODE, value: jwt }
      - { key: MAILER, value: smtp }
      - { key: DEV_SHOW_OTP, value: "false" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: vo-db, property: connectionString } }
      - { key: CORS_ORIGIN, sync: false }   # your web URL, e.g. https://vo-web.onrender.com
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MAIL_FROM, sync: false }
  - type: web
    name: vo-web
    runtime: static
    buildCommand: npm ci --workspaces --include-workspace-root && npm run build -w @vo/web
    staticPublishPath: apps/web/dist
    routes:
      - { type: rewrite, source: /api/*, destination: https://vo-api.onrender.com/api/* }  # change if your API URL differs
      - { type: rewrite, source: /*, destination: /index.html }
